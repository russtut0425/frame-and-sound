name: Add Liu Yuan album covers once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-liu-yuan-covers-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified covers and update catalog
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          albums = [
              {
                  "id": 10181,
                  "key": "album|梦桃花|刘元",
                  "title": "梦桃花",
                  "creator": "刘元",
                  "year": 1996,
                  "collection_id": 651962900,
              },
              {
                  "id": 10182,
                  "key": "album|旧路心情|刘元",
                  "title": "旧路心情",
                  "creator": "刘元",
                  "year": 1996,
                  "collection_id": 156118122,
              },
          ]

          Path("covers").mkdir(exist_ok=True)
          report_path = Path("album-covers.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))

          for album in albums:
              lookup_url = f"https://itunes.apple.com/lookup?id={album['collection_id']}&entity=album&country=us"
              request = urllib.request.Request(lookup_url, headers={"User-Agent": "frame-and-sound-cover-fetch/1.0"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              item = next(
                  result for result in payload.get("results", [])
                  if result.get("wrapperType") == "collection"
              )
              art_url = item["artworkUrl100"]
              art_url = re.sub(r"/\d+x\d+bb\.(?:jpg|png)$", "/600x600bb.jpg", art_url)
              art_request = urllib.request.Request(art_url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(art_request, timeout=30) as response:
                  image = response.read()
              if len(image) < 5000 or not image.startswith(b"\xff\xd8\xff"):
                  raise RuntimeError(f"Invalid JPEG for {album['title']}")
              cover_path = f"covers/{album['id']}.jpg"
              Path(cover_path).write_bytes(image)
              report.setdefault("covers", {})[album["key"]] = cover_path
              report.setdefault("metadata", {})[album["key"]] = {
                  "requested": {
                      "title": album["title"],
                      "creator": album["creator"],
                      "releaseYear": album["year"],
                  },
                  "matched": {
                      "title": item.get("collectionName", album["title"]),
                      "creator": item.get("artistName", album["creator"]),
                      "releaseYear": int(str(item.get("releaseDate", album["year"]))[:4]),
                      "collectionId": album["collection_id"],
                      "country": item.get("country", "US"),
                      "score": 1,
                      "source": art_url,
                      "database": "Apple iTunes Search API",
                  },
              }

          report["generatedAt"] = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
          report["total"] = 185
          report["matched"] = len(report["covers"])
          report["unmatched"] = report["total"] - report["matched"]
          report["covers"] = dict(sorted(report["covers"].items(), key=lambda pair: pair[0].casefold()))
          report["metadata"] = dict(sorted(report.get("metadata", {}).items(), key=lambda pair: pair[0].casefold()))
          report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          Path("album-covers.js").write_text(
              "window.albumCoverMap = " + json.dumps(report["covers"], ensure_ascii=False, indent=2) + ";\n",
              encoding="utf-8",
          )
          PY
      - name: Commit covers and remove this one-time task
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add album-covers.js album-covers.json covers/10181.jpg covers/10182.jpg
          git rm .github/workflows/add-liu-yuan-covers-once.yml
          git commit -m "Add verified covers for Liu Yuan albums"
          git push
