          download "https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/2501600/library_600x900_schinese_2x.jpg" "covers/game-2501600.jpg"
          download "https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/632360/library_600x900_2x.jpg" "covers/game-632360.jpg"
