          rm -f .github/workflows/import-game-covers.yml
      - name: Commit imported covers and retire importer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add covers .github/workflows/import-game-covers.yml
          git commit -m "Import verified game covers"
          git push
