name: Import game covers once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-game-covers.yml

permissions:
  contents: write

jobs:
  import-covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified Steam library covers
        shell: bash
        run: |
          set -u
          mkdir -p covers
          download() {
            url="$1"
            target="$2"
            temp="${target}.tmp"
            if curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 "$url" --output "$temp"; then
              mime="$(file -b --mime-type "$temp")"
              case "$mime" in
                image/jpeg|image/png|image/webp) mv "$temp" "$target" ;;
                *) echo "Unexpected content for $target: $mime"; rm -f "$temp" ;;
              esac
            else
              echo "Could not download $target"
              rm -f "$temp"
            fi
          }

          download "https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1091500/e8cc297849d8671372bc0e82bdd43f209d853cb8/library_capsule_schinese_2x.jpg" "covers/game-1091500.jpg"
          download "https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1623730/8d31d86616d5113128d4c60ca703b9cf7e6193a1/library_capsule_schinese_2x.jpg" "covers/game-1623730.jpg"
          download "https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1735700/5ac746581f61c6278be79cc830ca5a68f467b0c3/library_600x900_schinese_2x.jpg" "covers/game-1735700.jpg"
